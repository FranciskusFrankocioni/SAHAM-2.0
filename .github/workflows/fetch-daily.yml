name: Fetch daily price/volume/foreign-flow (frequent, trading hours)

# Runs every 15 minutes while IDX is open (09:00-16:00 WIB = 02:00-09:00
# UTC, weekdays) so numbers refresh several times a day instead of once.
#
# Source is Stockbit (scripts/fetch_stockbit_daily.py), not IDX directly:
# idx.co.id blocks GitHub Actions' IP ranges with a Cloudflare "Attention
# Required" interactive challenge (confirmed live 2026-08-16) — not
# something curl_cffi's TLS impersonation can get past, since it needs an
# actual browser/residential IP. Stockbit's authenticated API hasn't shown
# the same behavior. scripts/fetch_idx_daily.py is kept in the repo for
# reference but is no longer scheduled.
on:
  schedule:
    - cron: "*/15 2-9 * * 1-5"
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Fetch Stockbit daily snapshot and upsert into Postgres
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STOCKBIT_TOKEN: ${{ secrets.STOCKBIT_TOKEN }}
          WATCHLIST_CODES: ${{ secrets.WATCHLIST_CODES }}
        run: python scripts/fetch_stockbit_daily.py
