name: Fetch IDX daily snapshot (frequent, trading hours)

# Two things this workflow solves at once:
#
# 1. Vercel Cron on the Hobby plan only runs once a day, which isn't
#    enough to feel "close to live" during market hours. This runs every
#    15 minutes while IDX is open (09:00-16:00 WIB = 02:00-09:00 UTC,
#    weekdays).
# 2. idx.co.id's data endpoint returned HTTP 403 from Vercel's Node.js
#    runtime even with a proper session cookie — evidence of
#    fingerprint-level (TLS/HTTP2) bot detection that Node's fetch() has
#    no way to spoof. curl_cffi (Python) can impersonate a real Chrome
#    fingerprint, which is what scripts/fetch_idx_daily.py uses. So this
#    workflow runs that script directly against Postgres instead of
#    calling the (currently blocked) Vercel API route.
on:
  schedule:
    - cron: "*/15 2-9 * * 1-5"
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Fetch IDX daily snapshot and upsert into Postgres
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/fetch_idx_daily.py
